name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install browser test runtime
        run: yarn playwright install --with-deps chromium

      - name: Lint
        run: yarn lint

      - name: Check types
        run: yarn workspace react-motion-modal check-types

      - name: Verify release
        working-directory: apps/library
        run: yarn release:check

      - name: Install supported npm
        run: npm install -g npm@^11.5.1

      - name: Publish to npm with provenance
        working-directory: apps/library
        run: npm publish
